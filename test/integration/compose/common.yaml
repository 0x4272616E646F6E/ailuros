name: decision-waf-it

services:
  decision-waf:
    image: decision-waf-it/decision-waf:dev
    build: { context: ../../.., dockerfile: Dockerfile }
    environment:
      DECISION_WAF_CLASSIFIER_BACKEND: ${DECISION_WAF_CLASSIFIER_BACKEND:-jev}
      DECISION_WAF_CLASSIFIER_BASE_URL: ${DECISION_WAF_CLASSIFIER_BASE_URL:-http://stubmodel:8080}
      DECISION_WAF_CLASSIFIER_MODEL: ${DECISION_WAF_CLASSIFIER_MODEL:-stub}
      DECISION_WAF_CLASSIFIER_API_KEY: ${DECISION_WAF_CLASSIFIER_API_KEY:-}
      DECISION_WAF_CLASSIFIER_TIMEOUT: ${DECISION_WAF_CLASSIFIER_TIMEOUT:-1s}
      DECISION_WAF_INSPECTION_MODE: ${DECISION_WAF_INSPECTION_MODE:-lite}
      DECISION_WAF_FAILURE_MODE:
      DECISION_WAF_DEEP_OVERSIZE:
      DECISION_WAF_DEEP_MAX_MESSAGES:
      DECISION_WAF_EXTAUTHZ_ADDR:
      DECISION_WAF_POLICY_FILE: /policy.yaml
    volumes:
      - ../k8s/common/policy.yaml:/policy.yaml:ro
    ports:
      - "127.0.0.1::9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      stubmodel: { condition: service_healthy }

  stubmodel:
    image: decision-waf-it/stubmodel:dev
    build: { context: ../../.., dockerfile: test/integration/Dockerfile, target: stubmodel }
    ports:
      - "127.0.0.1::8080"
    healthcheck:
      test: ["CMD", "/stubmodel", "-healthcheck", "http://127.0.0.1:8080/healthz"]
      interval: 1s
      timeout: 3s
      retries: 30

  echo:
    image: decision-waf-it/echo:dev
    build: { context: ../../.., dockerfile: test/integration/Dockerfile, target: echo }
    networks:
      default:
        aliases: [app]
    ports:
      - "127.0.0.1::8081"
    healthcheck:
      test: ["CMD", "/echo", "-healthcheck", "http://127.0.0.1:8081/healthz"]
      interval: 1s
      timeout: 3s
      retries: 30
