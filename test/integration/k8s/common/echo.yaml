apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
spec:
  replicas: 1
  selector:
    matchLabels: { app: echo }
  template:
    metadata:
      labels: { app: echo }
    spec:
      containers:
        - name: echo
          image: decision-waf-it/echo:dev
          ports: [{ containerPort: 8080 }, { containerPort: 8081 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8081 }
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  selector: { app: echo }
  ports:
    - { name: http, port: 8080, appProtocol: kubernetes.io/h2c }
    - { name: admin, port: 8081 }
