apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - stubmodel.yaml
  - echo.yaml
  - gateway.yaml
images:
  - name: decision-waf
    newName: decision-waf-it/decision-waf
    newTag: dev
patches:
  - path: decision-waf.yaml
configMapGenerator:
  - name: decision-waf-policy
    behavior: replace
    files: [policy.yaml]
    options: { disableNameSuffixHash: true }
