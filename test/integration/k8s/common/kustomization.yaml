apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - stubmodel.yaml
  - echo.yaml
  - gateway.yaml
images:
  - name: ailuros
    newName: ailuros-it/ailuros
    newTag: dev
patches:
  - path: ailuros.yaml
configMapGenerator:
  - name: ailuros-policy
    behavior: replace
    files: [policy.yaml]
    options: { disableNameSuffixHash: true }
