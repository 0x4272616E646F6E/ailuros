apiVersion: apps/v1
kind: Deployment
metadata:
  name: stubmodel
spec:
  replicas: 1
  selector:
    matchLabels: { app: stubmodel }
  template:
    metadata:
      labels: { app: stubmodel }
    spec:
      containers:
        - name: stubmodel
          image: decision-waf-it/stubmodel:dev
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: stubmodel
spec:
  selector: { app: stubmodel }
  ports: [{ name: http, port: 8080 }]
