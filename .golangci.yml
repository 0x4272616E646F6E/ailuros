version: "2"

linters:
  default: standard
  enable:
    - gosec
    - bodyclose
    - errorlint
    - misspell
    - unconvert
    - copyloopvar
    - nolintlint
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*os.File).Close
        - (*google.golang.org/grpc.ClientConn).Close
        - (*github.com/fsnotify/fsnotify.Watcher).Close
    gosec:
      excludes:
        - G104
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
