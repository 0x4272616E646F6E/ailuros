categories:
  - name: sqli
    description: "SQL injection: SQL syntax, quotes, comments, or UNION/boolean tricks in parameters, headers, or body."
  - name: xss
    description: "Cross-site scripting: HTML or JavaScript payloads such as script tags, event handlers, or javascript: URLs."
  - name: path_traversal
    description: "Path traversal or local file inclusion: ../ sequences, encoded variants, or requests for sensitive files such as /etc/passwd."
  - name: rce
    description: "Remote code or command execution: shell metacharacters, command substitution, template or expression injection, deserialization payloads, or JNDI lookups."
  - name: scanner
    description: "Automated reconnaissance: vulnerability scanners, probing for admin panels, backups, .git or .env files, or known exploit paths."
  - name: credential_stuffing
    description: "Automated login abuse: scripted authentication attempts using lists of usernames and passwords."

routes:
  - match: { path_prefix: /admin }
    failure_mode: closed
  - match: { grpc_service: payments.v1.Payments }
    failure_mode: closed
    threshold: 0.6
