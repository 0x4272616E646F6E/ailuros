static_resources:
  listeners:
    - name: ingress
      address:
        socket_address: { address: 0.0.0.0, port_value: 8080 }
      # JA4 (optional; needs TLS terminated here): uncomment this, the
      # header_mutation filter below, and set DECISION_WAF_JA4_HEADER=x-decision-waf-ja4
      # on decision-waf. The filter overwrites any x-decision-waf-ja4 a client sends.
      # listener_filters:
      #   - name: envoy.filters.listener.tls_inspector
      #     typed_config:
      #       "@type": type.googleapis.com/envoy.extensions.filters.listener.tls_inspector.v3.TlsInspector
      #       enable_ja4_fingerprinting: true
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress
                upgrade_configs:
                  - upgrade_type: websocket
                use_remote_address: true
                internal_address_config:
                  cidr_ranges: [{ address_prefix: 192.0.2.255, prefix_len: 32 }]
                request_timeout: 60s
                stream_idle_timeout: 30s
                route_config:
                  virtual_hosts:
                    - name: app
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: app }
                http_filters:
                  # - name: envoy.filters.http.header_mutation
                  #   typed_config:
                  #     "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
                  #     mutations:
                  #       request_mutations:
                  #         - append:
                  #             header: { key: x-decision-waf-ja4, value: "%TLS_JA4_FINGERPRINT%" }
                  #             append_action: OVERWRITE_IF_EXISTS_OR_ADD
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service:
                        envoy_grpc: { cluster_name: decision-waf }
                      failure_mode_allow: false
                      message_timeout: 1.5s
                      request_attributes:
                        - source.address
                        - connection.requested_server_name
                        - connection.tls_version
                        - request.protocol
                      processing_mode:
                        request_header_mode: SEND
                        request_body_mode: FULL_DUPLEX_STREAMED
                        request_trailer_mode: SEND
                        response_header_mode: SKIP
                        response_body_mode: NONE
                        response_trailer_mode: SKIP
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: decision-waf
      type: STRICT_DNS
      connect_timeout: 1s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      health_checks:
        - timeout: 1s
          interval: 5s
          unhealthy_threshold: 2
          healthy_threshold: 1
          grpc_health_check: {}
      load_assignment:
        cluster_name: decision-waf
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: decision-waf, port_value: 9001 }
    - name: app
      type: STRICT_DNS
      connect_timeout: 1s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          use_downstream_protocol_config:
            http_protocol_options: {}
            http2_protocol_options: {}
      load_assignment:
        cluster_name: app
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: app, port_value: 8080 }
