events {}

http {
  upstream backend { server app:8080; }
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 1s;

  server {
    listen 80;

    location = /_decision_waf {
      internal;
      set $decision_waf_upstream decision-waf:9002;
      proxy_pass http://$decision_waf_upstream/;

      proxy_connect_timeout 1s;
      proxy_read_timeout 1500ms;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header X-Forwarded-Uri "";
      proxy_set_header X-Forwarded-Method "";
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Original-Method $request_method;
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
      auth_request /_decision_waf;
      auth_request_set $decision_waf_request_id $upstream_http_x_decision_waf_request_id;
      auth_request_set $decision_waf_status $upstream_status;
      proxy_set_header X-Decision-Waf-Request-Id $decision_waf_request_id;
      add_header X-Decision-Waf-Request-Id $decision_waf_request_id always;
      error_page 403 = @decision_waf_blocked;
      error_page 500 = @decision_waf_unavailable;
      proxy_pass http://backend;
    }

    location @decision_waf_blocked {
      add_header X-Decision-Waf-Request-Id $decision_waf_request_id always;
      default_type application/json;
      return 403 '{"error":"request blocked","request_id":"$decision_waf_request_id"}';
    }

    location @decision_waf_unavailable {
      add_header X-Decision-Waf-Request-Id $decision_waf_request_id always;
      default_type application/json;
      return 503 '{"error":"service unavailable","request_id":"$decision_waf_request_id"}';
    }

    # Fail open variant:
    # location @decision_waf_unavailable {
    #   add_header X-Decision-Waf-Request-Id $decision_waf_request_id always;
    #   default_type application/json;
    #   if ($decision_waf_status = 503) {
    #     return 503 '{"error":"service unavailable","request_id":"$decision_waf_request_id"}';
    #   }
    #   # Named locations do not inherit proxy_set_header from location /;
    #   # clear the header so a client-supplied ID never reaches the backend.
    #   proxy_set_header X-Decision-Waf-Request-Id "";
    #   proxy_pass http://backend;
    # }
  }
}
