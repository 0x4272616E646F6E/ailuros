http:
  middlewares:
    decision-waf:
      forwardAuth:
        address: http://decision-waf:9002/
        trustForwardHeader: false
        authResponseHeaders:
          - X-Decision-Waf-Request-Id
  routers:
    app:
      rule: Host(`app.example.com`)
      service: app
      middlewares: [decision-waf]
  services:
    app:
      loadBalancer:
        servers:
          - url: http://app:8080
