apiVersion: apps/v1
kind: Deployment
metadata:
  name: ailuros
  labels:
    app.kubernetes.io/name: ailuros
    app.kubernetes.io/component: decision-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ailuros
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ailuros
        app.kubernetes.io/component: decision-service
    spec:
      terminationGracePeriodSeconds: 20
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: ailuros
      serviceAccountName: ailuros
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ailuros
          image: ailuros
          ports:
            - { name: extproc, containerPort: 9001 }
            - { name: extauthz, containerPort: 9003 }
            - { name: metrics, containerPort: 9090 }
          env:
            - { name: AILUROS_INSPECTION_MODE, value: standard }
            - { name: AILUROS_CLASSIFIER_BACKEND, value: jev }
            - { name: AILUROS_CLASSIFIER_MODEL, value: "" }
            - { name: AILUROS_CLASSIFIER_TIMEOUT, value: 1s }
            - { name: AILUROS_FAILURE_MODE, value: open }
            - { name: AILUROS_BLOCK_THRESHOLD, value: "0.8" }
            - { name: AILUROS_POLICY_FILE, value: /etc/ailuros/policy.yaml }
            - { name: AILUROS_EXTPROC_ADDR, value: ":9001" }
            - { name: AILUROS_EXTAUTHZ_ADDR, value: "" }
            - { name: AILUROS_FORWARDAUTH_ADDR, value: "" }
            - { name: AILUROS_METRICS_ADDR, value: ":9090" }
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          readinessProbe:
            httpGet: { path: /readyz, port: metrics }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: policy, mountPath: /etc/ailuros, readOnly: true }
      volumes:
        - name: policy
          configMap:
            name: ailuros-policy
