apiVersion: apps/v1
kind: Deployment
metadata:
  name: decision-waf
  labels:
    app.kubernetes.io/name: decision-waf
    app.kubernetes.io/component: decision-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: decision-waf
  template:
    metadata:
      labels:
        app.kubernetes.io/name: decision-waf
        app.kubernetes.io/component: decision-service
    spec:
      terminationGracePeriodSeconds: 20
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: decision-waf
      serviceAccountName: decision-waf
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: decision-waf
          image: decision-waf
          ports:
            - { name: extproc, containerPort: 9001 }
            - { name: extauthz, containerPort: 9003 }
            - { name: metrics, containerPort: 9090 }
          env:
            - { name: DECISION_WAF_INSPECTION_MODE, value: standard }
            - { name: DECISION_WAF_CLASSIFIER_BACKEND, value: jev }
            - { name: DECISION_WAF_CLASSIFIER_MODEL, value: "" }
            - { name: DECISION_WAF_CLASSIFIER_TIMEOUT, value: 1s }
            - { name: DECISION_WAF_FAILURE_MODE, value: open }
            - { name: DECISION_WAF_BLOCK_THRESHOLD, value: "0.8" }
            - { name: DECISION_WAF_POLICY_FILE, value: /etc/decision-waf/policy.yaml }
            - { name: DECISION_WAF_EXTPROC_ADDR, value: ":9001" }
            - { name: DECISION_WAF_EXTAUTHZ_ADDR, value: "" }
            - { name: DECISION_WAF_FORWARDAUTH_ADDR, value: "" }
            - { name: DECISION_WAF_METRICS_ADDR, value: ":9090" }
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          readinessProbe:
            httpGet: { path: /readyz, port: metrics }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: metrics }
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - { name: policy, mountPath: /etc/decision-waf, readOnly: true }
      volumes:
        - name: policy
          configMap:
            name: decision-waf-policy
