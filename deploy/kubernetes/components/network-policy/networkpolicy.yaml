apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ailuros
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ailuros
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
              app.kubernetes.io/component: proxy
              app.kubernetes.io/managed-by: envoy-gateway
      ports:
        - { port: extproc }
        - { port: extauthz }
    - ports:
        - { port: metrics }
