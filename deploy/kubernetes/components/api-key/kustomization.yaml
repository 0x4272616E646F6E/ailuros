apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ailuros
      spec:
        template:
          spec:
            containers:
              - name: ailuros
                env:
                  - { name: AILUROS_CLASSIFIER_API_KEY_FILE, value: /etc/ailuros-secret/api-key }
                volumeMounts:
                  - { name: classifier-secret, mountPath: /etc/ailuros-secret, readOnly: true }
  - target: { kind: Deployment, name: ailuros }
    patch: |-
      - op: add
        path: /spec/template/spec/volumes/-
        value: { name: classifier-secret, secret: { secretName: ailuros-classifier } }
