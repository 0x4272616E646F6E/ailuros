apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: decision-waf
      spec:
        template:
          spec:
            containers:
              - name: decision-waf
                env:
                  - { name: DECISION_WAF_CLASSIFIER_API_KEY_FILE, value: /etc/decision-waf-secret/api-key }
                volumeMounts:
                  - { name: classifier-secret, mountPath: /etc/decision-waf-secret, readOnly: true }
  - target: { kind: Deployment, name: decision-waf }
    patch: |-
      - op: add
        path: /spec/template/spec/volumes/-
        value: { name: classifier-secret, secret: { secretName: decision-waf-classifier } }
