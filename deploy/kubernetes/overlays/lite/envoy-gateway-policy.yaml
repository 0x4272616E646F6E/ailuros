apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: decision-waf
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: eg
  extProc:
    - backendRefs:
        - name: decision-waf
          port: 9001
      messageTimeout: 1500ms
      failOpen: false
      processingMode:
        request:
          attributes:
            - source.address
            - connection.requested_server_name
            - connection.tls_version
            - request.protocol
