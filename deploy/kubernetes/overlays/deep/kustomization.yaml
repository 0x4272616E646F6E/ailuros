apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - envoy-gateway-policy.yaml
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ailuros
      spec:
        template:
          spec:
            containers:
              - name: ailuros
                env:
                  - { name: AILUROS_INSPECTION_MODE, value: deep }
