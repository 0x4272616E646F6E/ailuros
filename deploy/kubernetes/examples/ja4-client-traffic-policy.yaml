apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: ailuros-ja4
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: eg
  tls:
    fingerprints: [JA4]
  headers:
    earlyRequestHeaders:
      set:
        - name: x-ailuros-ja4
          value: "%TLS_JA4_FINGERPRINT%"
