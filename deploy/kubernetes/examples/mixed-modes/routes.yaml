apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-lite
spec:
  parentRefs: [{ name: eg }]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /static } }]
      backendRefs: [{ name: app, port: 8080 }]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-deep
spec:
  parentRefs: [{ name: eg }]
  rules:
    - matches: [{ path: { type: PathPrefix, value: / } }]
      backendRefs: [{ name: app, port: 8080 }]
