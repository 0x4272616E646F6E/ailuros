apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../overlays/lite
nameSuffix: -lite
labels:
  - pairs:
      app.kubernetes.io/instance: lite
    includeSelectors: true
components:
  - ../rename
patches:
  - target:
      kind: EnvoyExtensionPolicy
    patch: |-
      - op: replace
        path: /spec/targetRefs/0
        value: { group: gateway.networking.k8s.io, kind: HTTPRoute, name: app-lite }
