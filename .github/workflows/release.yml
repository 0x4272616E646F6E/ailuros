name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main"
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Unit tests
        run: go test -race -count=1 ./...

  image:
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/0x4272616e646f6e/decision-waf
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        name: Build and push by digest (no tags yet)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          provenance: false
          sbom: false
          no-cache: true
      - id: platforms
        name: Per-platform digests
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          raw=$(docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}")
          for arch in amd64 arm64; do
            d=$(jq -r --arg a "$arch" '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $a) | .digest' <<<"$raw")
            [ -n "$d" ] || { echo "::error::no linux/$arch manifest in $DIGEST"; exit 1; }
            echo "$arch=$d" >> "$GITHUB_OUTPUT"
          done
      - name: Scan linux/amd64 (Grype)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439
        with:
          image: ${{ env.IMAGE }}@${{ steps.platforms.outputs.amd64 }}
          severity-cutoff: high
          only-fixed: true
          fail-build: true
      - name: Scan linux/arm64 (Grype)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439
        with:
          image: ${{ env.IMAGE }}@${{ steps.platforms.outputs.arm64 }}
          severity-cutoff: high
          only-fixed: true
          fail-build: true
      - name: SBOM linux/amd64 (Syft, SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          image: ${{ env.IMAGE }}@${{ steps.platforms.outputs.amd64 }}
          format: spdx-json
          output-file: sbom-amd64.spdx.json
          artifact-name: sbom-amd64.spdx.json
          upload-release-assets: false
      - name: SBOM linux/arm64 (Syft, SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          image: ${{ env.IMAGE }}@${{ steps.platforms.outputs.arm64 }}
          format: spdx-json
          output-file: sbom-arm64.spdx.json
          artifact-name: sbom-arm64.spdx.json
          upload-release-assets: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Sign the image and attach each platform's SBOM (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          AMD64: ${{ steps.platforms.outputs.amd64 }}
          ARM64: ${{ steps.platforms.outputs.arm64 }}
        run: |
          cosign sign --yes --recursive "${IMAGE}@${DIGEST}"
          cosign attest --yes --type spdxjson --predicate sbom-amd64.spdx.json "${IMAGE}@${AMD64}"
          cosign attest --yes --type spdxjson --predicate sbom-arm64.spdx.json "${IMAGE}@${ARM64}"
      - name: Build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Point the version tags at the signed image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          META_JSON: ${{ steps.meta.outputs.json }}
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<<"$META_JSON")
          [ "${#tags[@]}" -gt 0 ] || { echo "::error::no version tags for $GITHUB_REF_NAME"; exit 1; }
          args=()
          for t in "${tags[@]}"; do args+=(-t "$t"); done
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"
